aid: dustphotonics
name: DustPhotonics
description: >-
  DustPhotonics is a fabless silicon photonics company founded in Israel in 2017 by Ben Rubovitch,
  Kobi Hasharoni and Amir Geron, building Photonic Integrated Circuit (SiPho PIC) engines and
  optical interconnect components for hyperscale and AI data centers. Its product line covers
  integrated laser engines (Oz4, Oz8, Carmel4, Carmel8) and external laser chips (Kfir, Kfir200,
  Tamar, Tamar200) spanning 400G to 1.6T, built around a proprietary L3C low-loss laser coupling
  technique that integrates lasers, modulators and photodetectors onto a single chip for optical
  transceivers, active optical cables and near-package optics. Credo Technology Group agreed to
  acquire DustPhotonics in April 2026 and completed the acquisition on 28 May 2026; the
  dustphotonics.com site now redirects into credosemi.com. The company sells silicon and optical
  hardware to system and transceiver makers and has never operated a public developer program,
  API, SDK or documentation portal.
